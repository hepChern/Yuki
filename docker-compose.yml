services:
  yuki:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: yuki:dev
    container_name: yuki-dev
    ports:
      - "3315:3315"
    volumes:
      - .:/app/Yuki
      # Host storage, shared with `yuki docker run` and native runs.
      # Bind mounts are uid-tolerant on Docker Desktop (macOS) — this
      # compose file targets macOS only; on Linux use `yuki docker run`.
      - ${YUKIDIR:-~/.Yuki}:/home/yuki/.Yuki
      # Optional CelebiChrono sibling checkout:
      #   CELEBI_DIR=../CelebiChrono docker compose up
      # Default mounts a committed placeholder dir (only a .gitkeep);
      # the PyPI celebichrono package still resolves normally.
      - type: bind
        source: ${CELEBI_DIR:-./docker/celebi-placeholder}
        target: /app/CelebiChrono
        bind:
          create_host_path: false
    environment:
      - FLASK_ENV=development
      - CELERY_BROKER_URL=amqp://localhost
    working_dir: /app
    stdin_open: true
    tty: true
